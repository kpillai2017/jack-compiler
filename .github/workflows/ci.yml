name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Fetch jackvm-py (to check the shared integrations.py matches)
        shell: bash
        run: |
          # The branch with the same name as this one, if jackvm-py has it; else main.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          dest="$RUNNER_TEMP/jackvm-py"
          git clone --quiet --depth 1 --branch "$branch" https://github.com/kpillai2017/jackvm-py.git "$dest" 2>/dev/null \
            || git clone --quiet --depth 1 https://github.com/kpillai2017/jackvm-py.git "$dest"
          echo "JACK_TOOLS_COMPANION=$dest" >> "$GITHUB_ENV"
          echo "Comparing with jackvm-py @ $(git -C "$dest" rev-parse --abbrev-ref HEAD) $(git -C "$dest" rev-parse --short HEAD)"

      - name: Run tests
        run: pytest -v
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Smoke-test CLI
        run: |
          jackc --version
          jackc-gui --version
          jackc examples/ -o output/
          jackc -r --clean --dry-run examples/
          jackc -r examples/ -o output-recursive/

  grammar:
    # Ensure committed ANTLR output is in sync with grammar/Jack.g4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Regenerate parser
        run: java -jar antlr-4.13.0-complete.jar -Dlanguage=Python3 -visitor -o jack_compiler/antlr_generated grammar/Jack.g4
      - name: Check for drift
        run: git diff --exit-code -- jack_compiler/antlr_generated
